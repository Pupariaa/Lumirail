<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumirail Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #11131a 0%, #0b0d12 100%);
      opacity: 1;
      transition: opacity 0.4s ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash-logo { width: 120px; height: auto; margin-bottom: 16px; }
    #splash-loading { font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500; color: rgba(233,238,252,0.75); margin-bottom: 12px; }
    #splash-log {
      width: min(92vw, 440px);
      min-height: 2.6em;
      margin-bottom: 16px;
      padding: 0 10px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 400;
      line-height: 1.45;
      color: rgba(160, 184, 220, 0.88);
      word-break: break-word;
    }
    #splash-title { font-family: 'DM Sans', sans-serif; font-size: 1.5rem; font-weight: 600; color: #e9eefc; margin-bottom: 8px; }
    #splash-version { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: rgba(233,238,252,0.55); }
  </style>
</head>

<body>
  <div id="splash">
    <img id="splash-logo" src="/assets/loader_animated.png" alt="" aria-hidden>
    <div id="splash-loading">Chargement en cours..</div>
    <div id="splash-log" aria-hidden="true"></div>
    <div id="splash-title">Lumirail Studio</div>
    <div id="splash-version">v0.1.0</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
