[package]
name = "lms-s1-g2-driver"
version = "0.0.1"
edition = "2021"
authors = ["Puparia"]
description = "Driver DLL for LMS-S1-G2 (ESP32 Master via CH9102F)"

[lib]
name = "lms_s1_g2_driver"
crate-type = ["cdylib", "rlib"]

[dependencies]
serialport = "4.3"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

