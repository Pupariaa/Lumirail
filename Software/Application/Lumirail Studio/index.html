<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumirail Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #11131a 0%, #0b0d12 100%);
      opacity: 1;
      transition: opacity 0.4s ease-out;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash-logo { width: 120px; height: auto; margin-bottom: 24px; animation: splash-pulse 1.5s ease-in-out infinite; }
    #splash-title { font-family: 'DM Sans', sans-serif; font-size: 1.5rem; font-weight: 600; color: #e9eefc; margin-bottom: 8px; }
    #splash-version { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: rgba(233,238,252,0.55); }
    #splash-spinner { width: 32px; height: 32px; margin-top: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #7c9cf7; border-radius: 50%; animation: splash-spin 0.8s linear infinite; }
    @keyframes splash-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="splash">
    <img id="splash-logo" src="/assets/logo-lumirail.png" alt="" aria-hidden>
    <div id="splash-title">Lumirail Studio</div>
    <div id="splash-version">v0.1.0</div>
    <div id="splash-spinner" aria-hidden></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
